name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build
        run: dotnet build Fuse.sln -c Release

      - name: Test
        run: dotnet test src/Fuse.Core.Tests/Fuse.Core.Tests.csproj -c Release --no-build
