name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build
        run: dotnet build Fuse.sln -c Release

      - name: Test
        shell: pwsh
        run: |
          dotnet test src/Fuse.Core.Tests/Fuse.Core.Tests.csproj -c Release --no-build --logger "console;verbosity=normal" 2>&1 | Tee-Object -FilePath test.log
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            Write-Host "::error::dotnet test exited with $code"
            Get-Content test.log |
              Select-String -Pattern '\[FAIL\]|Failed!|Failed |错误|失败|Error Message|Assert\.|Exception' |
              Select-Object -First 40 |
              ForEach-Object { Write-Host "::error::$($_.Line.Trim())" }
            exit 1
          }
